name: Build e publicar imagem Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Histórico completo (não só o último commit) — o build usa `git log`
          # para preencher o <lastmod> de cada página no sitemap.xml.
          fetch-depth: 0

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disparar deploy no Portainer
        run: curl -sf -X POST "${{ secrets.PORTAINER_WEBHOOK }}"

      - name: Health check pós-deploy
        run: |
          echo "Aguardando site voltar no ar..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://acsacarlis.adv.br/)
            echo "Tentativa $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then echo "✅ Site OK"; exit 0; fi
            sleep 5
          done
          echo "❌ Health check falhou"; exit 1
